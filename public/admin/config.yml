backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "site"
    label: "Configuración General"
    files:
      - name: "settings"
        label: "Contenido del sitio"
        file: "public/content/site.json"
        fields:
          - label: "Portada"
            name: "hero_slides"
            widget: "list"
            max: 3
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Texto", name: "copy", widget: "text" }
              - { label: "Imagen", name: "image", widget: "image" }

  - name: "agent"
    label: "Agente y contacto"
    files:
      - name: "agent"
        label: "Ficha del agente"
        file: "public/content/agent.json"
        fields:
          - { label: "Nombre", name: "name", widget: "string" }
          - { label: "Cargo", name: "role", widget: "string" }
          - { label: "Foto", name: "photo", widget: "image", required: false }
          - { label: "Teléfono 1", name: "phone_one", widget: "string" }
          - { label: "Teléfono 2", name: "phone_two", widget: "string" }
          - { label: "WhatsApp", name: "whatsapp", widget: "string" }
          - { label: "Correo", name: "email", widget: "string" }

  - name: "amenities"
    label: "Amenidades"
    files:
      - name: "amenities"
        label: "Amenidades disponibles"
        file: "public/content/amenities.json"
        fields:
          - label: "Lista de amenidades"
            name: "amenities"
            widget: "list"
            field: { label: "Amenidad", name: "amenity", widget: "string" }

  - name: "branding"
    label: "Logos"
    files:
      - name: "branding"
        label: "Logo superior e inferior"
        file: "public/content/branding.json"
        fields:
          - { label: "Logo de la barra superior", name: "header_logo", widget: "image" }
          - { label: "Logo del pie de página", name: "footer_logo", widget: "image" }

  - name: "social"
    label: "Redes sociales"
    files:
      - name: "social"
        label: "Enlaces sociales"
        file: "public/content/social.json"
        fields:
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }

  - name: "categories"
    label: "Explora por tipo"
    files:
      - name: "categories"
        label: "Categorías de propiedades"
        file: "public/content/categories.json"
        fields:
          - label: "Categorías"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Número", name: "number", widget: "string" }
              - { label: "Imagen", name: "image", widget: "image" }

  - name: "properties"
    label: "Propiedades"
    files:
      - name: "catalog"
        label: "Catálogo de propiedades"
        file: "public/content/properties.json"
        fields:
          - label: "Propiedades"
            name: "properties"
            widget: "list"
            required: false
            fields:
              - { label: "Código", name: "code", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Tipo", name: "type", widget: "select", options: [Apartamento, Casa, Villa, Terreno, "Local comercial", Oficina, "Proyecto inmobiliario"] }
              - { label: "Operación", name: "operation", widget: "select", options: [Venta, Alquiler, "Venta y alquiler"] }
              - { label: "Precio", name: "price", widget: "number", value_type: "float" }
              - { label: "Ubicación", name: "location", widget: "string" }
              - { label: "Área", name: "area", widget: "number", value_type: "float" }
              - { label: "Habitaciones", name: "beds", widget: "number", value_type: "int" }
              - { label: "Baños", name: "baths", widget: "number", value_type: "int" }
              - { label: "Etiqueta", name: "tag", widget: "string", default: "Nueva" }
              - { label: "Publicada", name: "is_published", widget: "boolean", default: true }
              - { label: "Destacada", name: "is_featured", widget: "boolean", default: false }
              - { label: "Imagen principal", name: "image", widget: "image" }
              - { label: "Galería", name: "gallery", widget: "list", field: { label: "Imagen", name: "image", widget: "image" }, required: false }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Amenidades existentes", name: "amenities", widget: "relation", collection: "amenities", file: "amenities", value_field: "amenities", search_fields: ["amenities"], display_fields: ["amenities"], multiple: true, required: false }
              - { label: "Amenidades nuevas", name: "custom_amenities", widget: "list", field: { label: "Nueva amenidad", name: "amenity", widget: "string" }, required: false }
